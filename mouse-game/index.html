<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מרוץ הגבינה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Silkscreen&display=swap">
<style>
/* Layout: a full-screen portrait phone game. The pixel room fills the screen behind a thin HUD,
   a floating joystick appears under the thumb, and menus sit in a centered panel.
   Deliberately single-theme: the game always takes place in a house at night. */
:root {
  color-scheme: dark;
  --night: #120e22;
  --panel: #231b3d;
  --line: #3d3166;
  --ink: #f7ecd6;
  --muted: #b3a9d3;
  --cheese: #ffd23f;
  --cheese-deep: #e8931c;
  --wood-dark: #2a1606;
  --danger: #ff5d6c;
  --display: "Rubik", "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --digits: "Silkscreen", ui-monospace, "Courier New", monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--display);
  font-size: 16px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#view {
  position: absolute;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
button { font-family: var(--display); cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--cheese); outline-offset: 4px; }

/* ---------- HUD ---------- */
.hud {
  position: absolute;
  inset-inline: 0;
  top: 0;
  box-sizing: border-box;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(rgb(12 9 24 / 0.88), rgb(12 9 24 / 0.55) 70%, rgb(12 9 24 / 0));
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.hud button { pointer-events: auto; }
.square-btn {
  flex: none;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 0;
  padding: 0;
  color: var(--ink);
  background: var(--panel);
  box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line);
}
.square-btn svg { width: 22px; height: 22px; shape-rendering: crispEdges; }
.hud-label {
  flex: 1;
  min-width: 0;
  font-weight: 800;
  font-size: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 8px;
  background: rgb(35 27 61 / 0.9);
  box-shadow: 0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line);
}
.chip img { width: 28px; height: 25px; image-rendering: pixelated; }
.chip b {
  font-family: var(--digits);
  font-weight: 400;
  font-size: 18px;
  direction: ltr;
  color: var(--cheese);
}
.chip.done b { color: #9be15d; }
.hearts { flex: none; display: flex; gap: 3px; }
.hearts img { width: 24px; height: 21px; image-rendering: pixelated; }

.trap-btn {
  position: absolute;
  right: 18px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
  width: 82px;
  height: 82px;
  border: 0;
  padding: 0;
  display: grid;
  place-items: center;
  background: var(--panel);
  box-shadow: 0 -4px 0 var(--cheese), 0 4px 0 var(--cheese), -4px 0 0 var(--cheese), 4px 0 0 var(--cheese), inset 0 -6px 0 #171129;
}
.trap-btn:active { transform: translateY(2px); }
.trap-btn img { width: 52px; height: 46px; image-rendering: pixelated; }
.trap-btn .count {
  position: absolute;
  top: -12px;
  left: -12px;
  min-width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  font-family: var(--digits);
  font-size: 16px;
  color: var(--wood-dark);
  background: var(--cheese);
  box-shadow: 0 0 0 3px var(--wood-dark);
}
.trap-btn .cap {
  position: absolute;
  bottom: -28px;
  inset-inline: -20px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  text-shadow: 0 1px 0 #000, 0 0 4px #000;
}

/* ---------- Floating joystick ---------- */
.joy {
  position: absolute;
  width: 120px;
  height: 120px;
  margin: -60px 0 0 -60px;
  border-radius: 50%;
  background: rgb(255 255 255 / 0.07);
  box-shadow: 0 0 0 3px rgb(255 255 255 / 0.35), inset 0 0 24px rgb(0 0 0 / 0.35);
  pointer-events: none;
}
.knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 56px;
  height: 56px;
  margin: -28px 0 0 -28px;
  border-radius: 50%;
  background: rgb(255 210 63 / 0.9);
  box-shadow: inset 0 -5px 0 var(--cheese-deep), 0 0 0 3px var(--wood-dark);
}

/* ---------- Hints and toasts ---------- */
.toast {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 80px);
  inset-inline: 0;
  margin-inline: auto;
  width: max-content;
  max-width: calc(100% - 40px);
  padding: 8px 18px;
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  color: var(--wood-dark);
  background: var(--cheese);
  box-shadow: 0 -3px 0 var(--wood-dark), 0 3px 0 var(--wood-dark), -3px 0 0 var(--wood-dark), 3px 0 0 var(--wood-dark);
  pointer-events: none;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity 160ms, transform 160ms steps(3);
}
.toast.show { opacity: 1; transform: none; }
.toast.cold { background: #9fd8ff; }
.toast.hot { background: #ff8a5c; }
.toast.good { background: #9be15d; }
.hint {
  position: absolute;
  inset-inline: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  pointer-events: none;
  font-weight: 800;
  font-size: 20px;
  text-align: center;
  text-shadow: 0 2px 0 #000, 0 0 8px #000;
}
.hint .finger {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgb(255 255 255 / 0.85);
  box-shadow: 0 0 0 6px rgb(255 255 255 / 0.25);
  animation: drag 1.6s ease-in-out infinite;
}
@keyframes drag {
  0%, 100% { transform: translate(-40px, 0); }
  50% { transform: translate(40px, -20px); }
}

/* ---------- Menus ---------- */
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  box-sizing: border-box;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: rgb(14 10 28 / 0.86);
  overflow: auto;
  touch-action: pan-y;
}
.panel {
  width: min(100%, 380px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.logo {
  margin: 0;
  font-weight: 800;
  font-size: clamp(40px, 13vw, 58px);
  line-height: 1;
  color: var(--cheese);
  text-shadow: 3px 3px 0 var(--cheese-deep), 6px 6px 0 #5a2d12;
  text-wrap: balance;
}
.panel h2 {
  margin: 0;
  font-weight: 800;
  font-size: 34px;
  line-height: 1.1;
  color: var(--cheese);
  text-shadow: 3px 3px 0 #5a2d12;
  text-wrap: balance;
}
.panel h2.bad { color: var(--danger); text-shadow: 3px 3px 0 #4a1020; }
.panel p { margin: 0; font-size: 17px; line-height: 1.5; color: var(--ink); text-wrap: balance; }
.panel p.muted { color: var(--muted); font-size: 15px; }
.hero { width: 100%; max-width: 320px; image-rendering: pixelated; }
.stack { width: 100%; display: flex; flex-direction: column; gap: 16px; padding-inline: 4px; box-sizing: border-box; }
.btn {
  width: 100%;
  min-height: 60px;
  border: 0;
  font-weight: 800;
  font-size: 21px;
  color: var(--wood-dark);
  background: var(--cheese);
  box-shadow: 0 -4px 0 var(--wood-dark), 0 4px 0 var(--wood-dark), -4px 0 0 var(--wood-dark), 4px 0 0 var(--wood-dark), inset 0 -6px 0 var(--cheese-deep);
}
.btn:active { transform: translateY(2px); }
.btn.alt {
  color: var(--ink);
  background: var(--panel);
  box-shadow: 0 -4px 0 var(--line), 0 4px 0 var(--line), -4px 0 0 var(--line), 4px 0 0 var(--line), inset 0 -6px 0 #171129;
}
.btn small { display: block; font-weight: 500; font-size: 14px; opacity: 0.8; }
.row { display: flex; gap: 16px; width: 100%; padding-inline: 4px; box-sizing: border-box; }
.row .btn { flex: 1; min-width: 0; }
.best { font-size: 15px; color: var(--muted); }
.best b { font-family: var(--digits); font-weight: 400; color: var(--cheese); direction: ltr; unicode-bidi: isolate; }
.levels {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  padding: 4px;
  box-sizing: border-box;
}
.lvl {
  aspect-ratio: 0.8;
  border: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ink);
  background: var(--panel);
  box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line), inset 0 -5px 0 #171129;
}
.lvl .n { font-family: var(--digits); font-size: 24px; line-height: 1; }
.lvl.locked { color: #5a5078; background: #1a1430; box-shadow: 0 -3px 0 #2a2248, 0 3px 0 #2a2248, -3px 0 0 #2a2248, 3px 0 0 #2a2248; }
.lvl.next {
  background: #3a2e12;
  box-shadow: 0 -3px 0 var(--cheese), 0 3px 0 var(--cheese), -3px 0 0 var(--cheese), 3px 0 0 var(--cheese), inset 0 -5px 0 #241a08;
}
.stars { display: flex; gap: 1px; direction: ltr; }
.stars img { width: 13px; height: 14px; image-rendering: pixelated; }
.rooms { display: flex; gap: 8px 16px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: var(--muted); }
.big-stars { display: flex; gap: 10px; direction: ltr; }
.big-stars img { width: 63px; height: 70px; image-rendering: pixelated; }
.big-stars img.pop { animation: pop 380ms steps(4) both; }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
.stats { display: flex; gap: 28px; justify-content: center; }
.stats div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stats span { font-size: 14px; color: var(--muted); }
.stats b { font-family: var(--digits); font-weight: 400; font-size: 26px; direction: ltr; }
@media (prefers-reduced-motion: reduce) {
  .toast, .big-stars img.pop, .hint .finger { transition: none; animation: none; }
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <canvas id="view" aria-label="החדר"></canvas>
  <div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>

  <header class="hud" id="hud" hidden>
    <button class="square-btn" id="pauseBtn" type="button" aria-label="השהיה">
      <svg viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor"><rect x="2" y="2" width="2" height="6"/><rect x="6" y="2" width="2" height="6"/></g></svg>
    </button>
    <span class="hud-label" id="hudLabel"></span>
    <div class="chip" id="cheeseChip"><img data-icon="cheese" alt=""><b id="cheeseText">0/5</b></div>
    <div class="hearts" id="hearts" aria-label="חיים"></div>
  </header>

  <button class="trap-btn" id="trapBtn" type="button" aria-label="הנחת מלכודת" hidden>
    <img id="trapIcon" alt="">
    <span class="count" id="trapCount">1</span>
    <span class="cap" id="trapCap">דבש</span>
  </button>

  <div class="hint" id="hint" hidden><div class="finger"></div><span>גררו את האצבע כדי לרוץ</span></div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <div class="overlay" id="overlay">
    <section class="panel" id="menuScreen">
      <h1 class="logo">מרוץ הגבינה</h1>
      <img class="hero" id="hero" alt="">
      <p>אספו את כל הגבינות בחדר ורוצו חזרה לחור לפני שהחתולים תופסים אתכם.</p>
      <div class="stack">
        <button class="btn" id="playBtn" type="button">שלבים</button>
        <button class="btn alt" id="endlessBtn" type="button">משחק אינסופי<small>כמה גבינות תספיקו לאסוף?</small></button>
        <button class="btn alt" id="soundBtn" type="button" aria-pressed="false">צליל: פועל</button>
      </div>
      <p class="best">שיא במשחק האינסופי: <b id="bestMenu">0</b></p>
    </section>

    <section class="panel" id="levelsScreen" hidden>
      <h2>בחרו שלב</h2>
      <div class="levels" id="levelGrid"></div>
      <p class="muted">מטבח, סלון ומזווה. כל שלב קשה יותר מהקודם.</p>
      <div class="stack"><button class="btn alt" id="levelsBack" type="button">חזרה</button></div>
    </section>

    <section class="panel" id="pauseScreen" hidden>
      <h2>הפסקה</h2>
      <div class="stack">
        <button class="btn" id="resumeBtn" type="button">המשיכו</button>
        <button class="btn alt" id="restartBtn" type="button">התחילו מחדש</button>
        <button class="btn alt" id="quitBtn" type="button">יציאה</button>
      </div>
    </section>

    <section class="panel" id="winScreen" hidden>
      <h2>הגעתם הביתה!</h2>
      <div class="big-stars" id="winStars"></div>
      <div class="stats">
        <div><span>זמן</span><b id="winTime">0</b></div>
        <div><span>חיים</span><b id="winLives">3</b></div>
      </div>
      <p class="muted" id="winTip"></p>
      <div class="stack">
        <button class="btn" id="nextBtn" type="button">לשלב הבא</button>
      </div>
      <div class="row">
        <button class="btn alt" id="winRetry" type="button">שוב</button>
        <button class="btn alt" id="winLevels" type="button">שלבים</button>
      </div>
    </section>

    <section class="panel" id="loseScreen" hidden>
      <h2 class="bad">החתולים תפסו אתכם</h2>
      <p id="loseText"></p>
      <div class="stack">
        <button class="btn" id="loseRetry" type="button">נסו שוב</button>
        <button class="btn alt" id="loseLevels" type="button">שלבים</button>
      </div>
    </section>

    <section class="panel" id="overScreen" hidden>
      <h2 class="bad">החתולים תפסו אתכם</h2>
      <div class="stats">
        <div><span>ניקוד</span><b id="overScore">0</b></div>
        <div><span>גבינות</span><b id="overCheese">0</b></div>
        <div><span>שיא</span><b id="overBest">0</b></div>
      </div>
      <p id="overText"></p>
      <div class="stack">
        <button class="btn" id="overAgain" type="button">שחקו שוב</button>
        <button class="btn alt" id="overMenu" type="button">לתפריט</button>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';

// ============================================================
// Basics
// ============================================================
const WW = 192, WH = 320;                 // room size in game pixels
const WALL_TOP = 32, WALL_SIDE = 8, WALL_BOTTOM = 8;
const MIN_X = WALL_SIDE, MAX_X = WW - WALL_SIDE, MIN_Y = WALL_TOP, MAX_Y = WH - WALL_BOTTOM;
const STEP = 1 / 120;
const OUT = '#170f24';

const $ = (id) => document.getElementById(id);
const canvas = $('view');
const ctx = canvas.getContext('2d');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s = (Math.imul(s ^ (s >>> 15), 2246822519) + 0x9e3779b9) >>> 0;
    s ^= s >>> 13;
    return (s >>> 0) / 4294967296;
  };
}
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s | 0) * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}

// ============================================================
// Sprites (pixel strings; front and back views are mirrored halves)
// ============================================================
function sym(halves, patches) {
  const rows = halves.map((h) => (h + [...h].reverse().join('')).split(''));
  for (const [r, c, ch] of patches || []) rows[r][c] = ch;
  return rows.map((r) => r.join(''));
}
function withRows(base, repl) {
  const out = base.slice();
  for (const [i, row] of Object.entries(repl)) out[i] = row;
  return out;
}

const MOUSE_SIDE = [
  '................', '................', '................', '................', '................',
  '.........kkk....', '........kpppk...', '........kpPpk...', '....kkkkkpppk...', '...kggggggkkgk..',
  '..kgggggggggwek.', 'p.kgggggggggggpk', '.pkglllllgggGkk.', '..kkGlllGGGGk...', '...kkGkkkkGkk...', '....kk...kk.....',
];
const MOUSE_SIDE2 = withRows(MOUSE_SIDE, { 10: 'p.kgggggggggwek.', 11: '.pkgggggggggggpk', 12: '..kglllllgggGkk.', 14: '..kkGkk..kGkk...', 15: '..kk.......kk...' });
const MOUSE_HIT = withRows(MOUSE_SIDE, { 10: '..kggggggggkgkk.', 11: 'p.kgggggggggkgpk' });
const MOUSE_DOWN = sym(
  ['........', '........', '..kkk...', '.kpppk..', '.kpPpk..', '.kpppkkk', '..kkgggg', '..kggwgg', '..kggegg', '..kglggp', '...kgggg', '..kgglll', '..kgglll', '..kgglll', '...kgkkk', '....kk..'],
  [[11, 15, 'p'], [12, 15, 'p'], [13, 14, 'p']]);
const MOUSE_UP = sym(
  ['........', '........', '..kkk...', '.kgggk..', '.kgGgk..', '.kgggkkk', '..kkgggg', '..kggggg', '..kggggg', '..kgGggg', '...kgggg', '..kggggg', '..kggggg', '..kgGggg', '...kgkkk', '....kk..'],
  [[13, 8, 'P'], [14, 8, 'p'], [15, 8, 'p'], [15, 9, 'p']]);
const stepA = (rows) => withRows(rows, { 15: rows[15].slice(0, 8) + '........' });
const stepB = (rows) => withRows(rows, { 15: '........' + rows[15].slice(8) });

const CAT_SIDE = [
  '................', '..........k...k.', '.kk......kok.kok', 'kOk......koooook', 'kok......koyoyok', '.kok.....kocncok',
  '..kokkkkkkocccok', '...kooOooOooookk', '...koOooOoooOok.', '...kooOooOoooOk.', '...koccccooooOk.', '...kkccccoooOk..',
  '....kOkkkkkkOk..', '....kok....kok..', '....kk.....kk...', '................',
];
const CAT_SIDE2 = withRows(CAT_SIDE, { 12: '...kOkkkkkkkkOk.', 13: '..kok.......kok.', 14: '..kk.........kk.' });
const CAT_CROUCH = withRows(CAT_SIDE, {
  1: '................', 2: '..........k...k.', 3: '.kk......kok.kok', 4: 'kOk......koooook', 5: 'kok......koyoyok',
  6: '.kokkkkkkkocncok', 7: '..kooOooOooccok.', 8: '..koOooOoooOook.', 9: '..kooOooOoooOok.', 10: '..koccccooooOok.',
  11: '..kkccccoooOkk..', 12: '..kOkkkkkkkkOk..', 13: '..kk........kk..', 14: '................',
});
const CAT_TAIL = [[9, 14, 'k'], [10, 14, 'O'], [10, 15, 'k'], [11, 14, 'o'], [11, 15, 'k'], [12, 14, 'o'], [12, 15, 'k'], [13, 14, 'k']];
const CAT_DOWN = sym(
  ['........', '.kk.....', '.knk....', '.knokkkk', '.kooooOo', '.kooyooo', '.kookooo', '.koocccn', '..kocccc', '...kkooo', '..kooocc', '..kooocc', '..kOoocc', '..kooooo', '...kcckk', '....kk..'],
  CAT_TAIL);
const CAT_UP = sym(
  ['........', '.kk.....', '.kok....', '.kookkkk', '.kooooOo', '.koOoooo', '.kooooOo', '.koooooo', '..kooooo', '...kkooo', '..kooOoo', '..kOoooo', '..kooOoo', '..kOoooo', '...kokkk', '....kk..'],

function makeSprite(rows, pal) {
  const w = Math.max(...rows.map((r) => r.length));
  const [c, g] = newCanvas(w, rows.length);
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      const col = pal[r[x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
}
function flip(src) {
  const [c, g] = newCanvas(src.width, src.height);
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
function charSet(side, side2, down, up, pal, extra) {
  const r = [makeSprite(side, pal), makeSprite(side2, pal)];
  const set = {
    right: r, left: r.map(flip),
    down: [makeSprite(down, pal), makeSprite(stepA(down), pal), makeSprite(stepB(down), pal)],
    up: [makeSprite(up, pal), makeSprite(stepA(up), pal), makeSprite(stepB(up), pal)],
  };
  for (const [k, rows] of Object.entries(extra || {})) { const s = makeSprite(rows, pal); set[k] = { right: s, left: flip(s) }; }
  return set;
}

const GLYPH = {
  0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001',
  5: '111100111001111', 6: '111100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001111',
  '+': '000010111010000', '!': '010010010000010',
};
function drawText(g, str, x, y, color) {
  const chars = String(str).split('');
  const pass = (col, ox, oy) => {
    g.fillStyle = col;
    chars.forEach((ch, i) => {
      const bits = GLYPH[ch];
      if (!bits) return;
      for (let b = 0; b < 15; b++) if (bits[b] === '1') g.fillRect(x + i * 4 + (b % 3) + ox, y + Math.floor(b / 3) + oy, 1, 1);
    });
  };
  pass(OUT, 1, 0); pass(OUT, -1, 0); pass(OUT, 0, 1); pass(OUT, 0, -1);
  pass(color, 0, 0);
}

function furnitureSprite(f) {

  const [c, g] = newCanvas(w, h + H);
  const P = (col, x, y, ww = 1, hh = 1) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); };
  const block = (top, topHi, topLo, front, frontHi, frontLo) => {
    P(top, 0, 0, w, h);
    P(topHi, 1, 1, w - 2, 1);
    P(topLo, 1, h - 1, w - 2, 1);
    P(front, 0, h, w, H);
    P(frontHi, 1, h, w - 2, 1);
    P(frontLo, 0, h + H - 1, w, 1);
    P(OUT, 0, 0, w, 1); P(OUT, 0, 0, 1, h + H); P(OUT, w - 1, 0, 1, h + H); P(OUT, 0, h + H - 1, w, 1);
  };
  const legs = (col) => {
    P(col, 0, h, w, 2); P(OUT, 0, h + 2, w, 1);
    for (const lx of [1, w - 4]) { P(col, lx, h + 3, 3, H - 3); P(OUT, lx, h + H - 1, 3, 1); }
  };
  switch (f.t) {
    case 'counter': {
      block('#d9d2c3', '#f2ecdf', '#b5ad9d', '#8a5a36', '#a56c42', '#5c3a22');
      for (let i = 0; i < 6; i++) P('#c2baa9', 2 + Math.floor(hash(f.x, f.y, i) * (w - 4)), 2 + Math.floor(hash(f.y, f.x, i) * (h - 4)));
      const doors = Math.max(1, Math.round(w / 14)), dw = w / doors;
      for (let i = 0; i < doors; i++) {
        const x0 = Math.round(i * dw);
        if (i > 0) P('#5c3a22', x0, h + 1, 1, H - 2);
        P('#f0cf86', Math.round(x0 + dw / 2) - 1, h + 3, 2, 1);
      }
      break;
    }
    case 'stove': {
      block('#3a3a48', '#55556a', '#2a2a34', '#c9c9d4', '#e6e6ee', '#8a8a98');
      for (const [bx, by] of [[4, 3], [w - 10, 3], [4, h - 7], [w - 10, h - 7]]) { P('#1c1c24', bx, by, 6, 4); P('#e2542b', bx + 2, by + 1, 2, 2); }
      P('#1c1c24', 3, h + 3, w - 6, H - 5); P('#e2542b', 5, h + H - 4, w - 10, 1);

    }
    case 'table':
    case 'coffee': {
      const wood = f.t === 'table' ? ['#b0703c', '#d08a4c', '#8c5530', '#7a4a2b'] : ['#6b4a8a', '#8866a8', '#553a70', '#3f2a55'];
      P(wood[0], 0, 0, w, h);
      for (let y = 5; y < h; y += 6) P(wood[2], 1, y, w - 2, 1);
      P(wood[1], 1, 1, w - 2, 1);
      P(OUT, 0, 0, w, 1); P(OUT, 0, 0, 1, h + 2); P(OUT, w - 1, 0, 1, h + 2);
      legs(wood[3]);
      if (f.t === 'table') { P('#f2ecd8', Math.round(w / 2) - 4, 5, 8, 6); P('#ffe36b', Math.round(w / 2) - 2, 6, 4, 3); }
      else { P('#e0b33a', 6, 5, 6, 8); P('#c9463d', w - 14, 8, 8, 6); }
      break;
    }
    case 'chair': {
      P('#9c5f35', 0, 0, w, h); P('#b87444', 1, 1, w - 2, 1);
      P(OUT, 0, 0, w, 1); P(OUT, 0, 0, 1, h + 2); P(OUT, w - 1, 0, 1, h + 2);
      legs('#6b3f22');

    }
    case 'box': {

      const leaves = [[w / 2, h / 2, 6], [w / 2 - 4, h / 2 + 1, 4], [w / 2 + 4, h / 2 - 1, 4], [w / 2, h / 2 - 5, 4]];
      for (const [lx, ly, r] of leaves) {
        for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) {
          const d = xx * xx + yy * yy;
          if (d <= r * r) P(d > (r - 1) * (r - 1) ? '#2f7a3a' : (yy < 0 ? '#6cbf6a' : '#4aa050'), Math.round(lx + xx), Math.round(ly + yy));

    case 'piano': {
      block('#1e1a26', '#3a3348', '#141018', '#15121c', '#2a2436', '#08060c');
      P('#f2ecd8', 2, h + 2, w - 4, 4);
      for (let x = 3; x < w - 3; x += 3) P('#15121c', x, h + 2, 1, hash(x, 1, 1) > 0.35 ? 3 : 4);
      P('#e0b33a', 4, 3, 6, 1);

    }
    case 'sack': {
      P('#d8c79a', 1, 0, w - 2, h + H - 1); P('#efe2bb', 2, 1, w - 4, 2);

        }

  }
  for (const r of room.rugs) {

  // Back wall with windows
  for (let x = 0; x < WW; x++) P(x % 6 < 3 ? wl.paper : wl.paper2, x, 0, 1, WALL_TOP);
  P(wl.top, 0, 0, WW, 4);
  P(wl.base, 0, WALL_TOP - 6, WW, 6);

  P(OUT, 0, WALL_TOP - 1, WW, 1);
  for (const wx of [30, 150]) {

    P('#fff4c2', wx + 2, 9, 3, 3); P('#1d2a5e', wx + 3, 9, 2, 2);
    P('#ffffff', wx - 5, 15); P('#c9d6ff', wx - 1, 10);
    P(wl.trim, wx - 1, 7, 1, 12); P(wl.trim, wx - 8, 12, 16, 1); P(wl.trim, wx - 10, 20, 20, 1);
  }

  const hx = room.hole;

  P(wl.trim, hx - 7, WALL_TOP - 12, 1, 12); P(wl.trim, hx + 6, WALL_TOP - 12, 1, 12);
  P(wl.trim, hx - 6, WALL_TOP - 13, 2, 1); P(wl.trim, hx + 4, WALL_TOP - 13, 2, 1); P(wl.trim, hx - 4, WALL_TOP - 15, 8, 1);
  // Side and bottom walls

// ============================================================
// Navigation grid (8px cells) for the cats
// ============================================================
const CELL = 8, NC = WW / CELL, NR = WH / CELL;
const navFree = new Uint8Array(NC * NR);
let solids = [];
const distBuf = new Int16Array(NC * NR);
const queue = new Int32Array(NC * NR);
const fieldCache = new Map();

function boxOverlapsSolid(x, y, hw, hh) {
  const bx = x - hw, by = y - 2 * hh, bw = 2 * hw, bh = 2 * hh;
  if (bx < MIN_X || bx + bw > MAX_X || by < MIN_Y || y > MAX_Y) return true;
  for (const r of solids) if (bx < r.x + r.w && bx + bw > r.x && by < r.y + r.h && by + bh > r.y) return true;
  return false;
}
function buildNav() {
  for (let j = 0; j < NR; j++) for (let i = 0; i < NC; i++) {
    navFree[j * NC + i] = boxOverlapsSolid(i * CELL + 4, j * CELL + 4, 5, 3) ? 0 : 1;
  }
  fieldCache.clear();
}
const cellOf = (x, y) => clamp(Math.floor(y / CELL), 0, NR - 1) * NC + clamp(Math.floor(x / CELL), 0, NC - 1);
function nearestFreeCell(x, y) {
  let best = cellOf(x, y);
  if (navFree[best]) return best;
  let bd = Infinity;
  for (let k = 0; k < NC * NR; k++) {
    if (!navFree[k]) continue;
    const d = ((k % NC) * CELL + 4 - x) ** 2 + (Math.floor(k / NC) * CELL + 4 - y) ** 2;
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}
function flowField(x, y, now) {
  const goal = nearestFreeCell(x, y);
  const cached = fieldCache.get(goal);
  if (cached && now - cached.t < 0.25) return cached.f;
  distBuf.fill(-1);
  let head = 0, tail = 0;
  distBuf[goal] = 0; queue[tail++] = goal;
  while (head < tail) {
    const k = queue[head++], i = k % NC, j = (k - i) / NC, d = distBuf[k] + 1;
    if (i > 0 && navFree[k - 1] && distBuf[k - 1] < 0) { distBuf[k - 1] = d; queue[tail++] = k - 1; }
    if (i < NC - 1 && navFree[k + 1] && distBuf[k + 1] < 0) { distBuf[k + 1] = d; queue[tail++] = k + 1; }
    if (j > 0 && navFree[k - NC] && distBuf[k - NC] < 0) { distBuf[k - NC] = d; queue[tail++] = k - NC; }
    if (j < NR - 1 && navFree[k + NC] && distBuf[k + NC] < 0) { distBuf[k + NC] = d; queue[tail++] = k + NC; }
  }
  const f = distBuf.slice();
  fieldCache.set(goal, { f, t: now });
  if (fieldCache.size > 24) fieldCache.delete(fieldCache.keys().next().value);
  return f;
}
function clearPath(x0, y0, x1, y1, hw, hh) {
  const steps = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3);
  for (let s = 1; s < steps; s++) {
    const t = s / steps;
    if (boxOverlapsSolid(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, hw, hh)) return false;
  }
  return true;
}
// Direction a cat at (x, y) should walk to reach (tx, ty).
function steer(x, y, tx, ty, now) {
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy);
  if (d < 1) return { x: 0, y: 0 };
  if (d < 90 && clearPath(x, y, tx, ty, 5, 3)) return { x: dx / d, y: dy / d };
  const field = flowField(tx, ty, now);
  const here = nearestFreeCell(x, y), hi = here % NC, hj = (here - hi) / NC;
  let best = -1, bestD = field[here] < 0 ? 9999 : field[here];
  for (let oj = -1; oj <= 1; oj++) for (let oi = -1; oi <= 1; oi++) {
    if (!oi && !oj) continue;
    const i = hi + oi, j = hj + oj;
    if (i < 0 || j < 0 || i >= NC || j >= NR) continue;
    const k = j * NC + i;
    if (!navFree[k] || field[k] < 0) continue;
    if (oi && oj && (!navFree[hj * NC + i] || !navFree[j * NC + hi])) continue;
    const v = field[k] + (oi && oj ? 0.4 : 0);
    if (v < bestD) { bestD = v; best = k; }
  }
  if (best < 0) return { x: dx / d, y: dy / d };
  const ex = (best % NC) * CELL + 4 - x, ey = Math.floor(best / NC) * CELL + 4 - y, el = Math.hypot(ex, ey) || 1;
  return { x: ex / el, y: ey / el };
}

// ============================================================
// Game state
// ============================================================
const G = {
  screen: 'menu', prev: null,
  mode: 'story', level: 0,
  lives: 3, livesLost: 0, score: 0, got: 0, goal: 5, eaten: 0,
  time: 0, clock: 0, stateTime: 0,
  holeOpen: false,
  speed: 40, pounce: true,
  itemTimer: 8, nextCatAt: 4,
  shake: 0, flash: 0,
  moved: false,
};
let room = ROOMS[0], roomCanvas = null, furn = [];
let mouse = null, cats = [], items = [], traps = [], inventory = [], yarnBall = null, particles = [], floaters = [];
const progress = store.get('cheese-run2-progress', { unlocked: 1, stars: [] });
let best = store.get('cheese-run2-best', 0) || 0;
const input = { x: 0, y: 0 };

function loadRoom(index) {
  room = ROOMS[index % ROOMS.length];
  solids = room.furniture.map((f) => ({ x: f.x, y: f.y, w: f.w, h: f.h }));
  furn = room.furniture.map((f) => ({ f, img: furnitureSprite(f), base: f.y + f.h }));
  roomCanvas = renderRoom(room);
  buildNav();
}

const holeSpot = () => ({ x: room.hole, y: WALL_TOP + 16 });
const doorSpot = () => ({ x: room.door, y: WH - WALL_BOTTOM - 2 });

function makeMouse() {
  const h = holeSpot();
  return { x: h.x, y: h.y, vx: 0, vy: 0, hw: 4, hh: 3, face: 'down', anim: 0, invuln: 0, boost: 0 };
}
function makeCat(kind, delay) {
  const d = doorSpot();
  return {
    kind, x: d.x, y: d.y, vx: 0, vy: 0, hw: 5, hh: 3, face: 'up', anim: Math.random() * 3,
    state: 'away', timer: delay, cool: 1.5 + Math.random(), mood: 'hunt', moodT: 4 + Math.random() * 3,
    lastX: d.x, lastY: d.y, jam: 0, jt: 0, jx: 0, jy: 0, happy: false, wander: null,
  };
}

function randomSpot(rng, minFromMouse, others, spacing, far) {
  const r = rng || Math.random;
  for (let tries = 0; tries < 400; tries++) {
    const x = MIN_X + 8 + r() * (MAX_X - MIN_X - 16);
    const y = MIN_Y + 14 + r() * (MAX_Y - MIN_Y - 22);
    if (boxOverlapsSolid(x, y, 7, 5)) continue;
    if (mouse && Math.hypot(mouse.x - x, mouse.y - y) < minFromMouse) continue;
    if (others.some((o) => Math.hypot(o.x - x, o.y - y) < spacing)) continue;
    if (Math.hypot(x - room.door, y - (WH - 20)) < 26) continue;
    if (far && Math.hypot(x - far.x, y - far.y) < far.d) continue;
    if (!navFree[cellOf(x, y)]) continue;
    return { x, y };
  }
  return null;
}

// ---- Flow ----
function startStory(level) {
  G.mode = 'story';
  G.level = level;
  const L = LEVELS[level];
  loadRoom(L.room);
  G.goal = L.cheese; G.speed = L.speed; G.pounce = L.pounce;
  G.lives = 3; G.livesLost = 0; G.got = 0; G.score = 0; G.clock = 0;
  G.holeOpen = false;
  resetWorld();
  const rng = seeded(1000 + level * 77);
  items = [];
  for (let i = 0; i < L.cheese; i++) {
    const s = randomSpot(rng, 50, items, 28);
    if (s) items.push({ type: 'cheese', x: s.x, y: s.y, phase: rng() * 6 });
  }
  G.goal = items.length;
  cats = [];
  for (let i = 0; i < L.cats; i++) cats.push(makeCat(i, 1.6 + i * Math.max(1.2, 2.6 - level * 0.15)));
  G.itemTimer = 6;
  enterPlay();
  $('hudLabel').textContent = `שלב ${level + 1}`;
  G.moved = false;
  $('hint').hidden = level !== 0;
  toast(level === 0 ? 'אספו את כל הגבינות' : `${room.name}: ${G.goal} גבינות, ${L.cats === 1 ? 'חתול אחד' : L.cats + ' חתולים'}`);
  updateHud(true);
}

function startEndless() {
  G.mode = 'endless';
  loadRoom(Math.floor(Math.random() * ROOMS.length));
  G.speed = 37; G.pounce = true;
  G.lives = 3; G.livesLost = 0; G.score = 0; G.eaten = 0; G.clock = 0; G.nextCatAt = 4;
  G.holeOpen = false;
  resetWorld();
  items = [];
  cats = [makeCat(0, 1.6)];
  for (let i = 0; i < 3; i++) spawnCheese();
  G.itemTimer = 7;
  enterPlay();
  $('hudLabel').textContent = 'אינסופי';
  $('hint').hidden = true;
  toast('אספו כמה שיותר גבינות');
  updateHud(true);
}

function resetWorld() {
  mouse = makeMouse();
  traps = []; inventory = []; yarnBall = null; particles = []; floaters = [];
  input.x = input.y = 0;
  camX = mouse.x - vw / 2; camY = -hudPx;
}

function enterPlay() {
  G.screen = 'play';
  G.stateTime = 0;
  showScreen(null);
  hudPx = $('hud').offsetHeight / scale;
  updateTrapButton();
}

function spawnCheese() {
  const s = randomSpot(null, 45, items.concat(cats), 24);
  if (s) items.push({ type: Math.random() < 0.1 ? 'gold' : 'cheese', x: s.x, y: s.y, phase: Math.random() * 6, born: G.time });
}

function spawnPowerup() {
  const pool = ['chili', 'chili', 'yarn', 'yarn', 'honey', 'honey', 'banana', 'banana'];
  if (G.mode === 'story') pool.push('gold');
  if (G.lives < 3) pool.push('heart');
  const s = randomSpot(null, 40, items.concat(cats), 24);
  if (s) items.push({ type: pick(pool), x: s.x, y: s.y, phase: 0, life: 11, power: true });
}

// ============================================================
// Update
// ============================================================
function moveBox(e, dx, dy) {
  if (dx) {
    e.x += dx;
    for (const r of solids) {
      if (e.x - e.hw < r.x + r.w && e.x + e.hw > r.x && e.y - 2 * e.hh < r.y + r.h && e.y > r.y) {
        e.x = dx > 0 ? r.x - e.hw - 0.01 : r.x + r.w + e.hw + 0.01;
        e.hitX = true;
      }
    }
    const cx = clamp(e.x, MIN_X + e.hw, MAX_X - e.hw);
    if (cx !== e.x) { e.x = cx; e.hitX = true; }
  }
  if (dy) {
    e.y += dy;
    for (const r of solids) {
      if (e.x - e.hw < r.x + r.w && e.x + e.hw > r.x && e.y - 2 * e.hh < r.y + r.h && e.y > r.y) {
        e.y = dy > 0 ? r.y - 0.01 : r.y + r.h + 2 * e.hh + 0.01;
        e.hitY = true;
      }
    }
    const cy = clamp(e.y, MIN_Y + 2 * e.hh, MAX_Y);
    if (cy !== e.y) { e.y = cy; e.hitY = true; }
  }
}
function faceFrom(vx, vy, current) {
  if (Math.abs(vx) < 0.01 && Math.abs(vy) < 0.01) return current;
  if (Math.abs(vx) >= Math.abs(vy) * 0.85) return vx > 0 ? 'right' : 'left';
  return vy > 0 ? 'down' : 'up';
}

function updateMouse(dt) {
  const m = mouse;
  if (m.boost > 0) m.boost -= dt;
  if (m.invuln > 0) m.invuln -= dt;
  const top = 78 * (m.boost > 0 ? 1.5 : 1);
  const k = Math.min(1, dt * 18);
  m.vx += (input.x * top - m.vx) * k; m.vy += (input.y * top - m.vy) * k;
  moveBox(m, m.vx * dt, m.vy * dt);
  const sp = Math.hypot(m.vx, m.vy);
  if (sp > 6) { m.face = faceFrom(m.vx, m.vy, m.face); m.anim += dt * sp / 9; }
  else m.anim = 0;
  if (sp > 6 && !G.moved) { G.moved = true; $('hint').hidden = true; }
  if (m.boost > 0 && sp > 10 && Math.random() < dt * 30) {
    particles.push({ x: m.x - m.vx / sp * 5, y: m.y - 2, vx: -m.vx * 0.2 + rand(-8, 8), vy: rand(-20, -8), life: 0.35, max: 0.35, color: pick(['#ff5a2a', '#ffb13b', '#ffe36b']) });
  }
}

function catTarget(c) {
  if (yarnBall) return { x: yarnBall.x, y: yarnBall.y, yarn: true };
  if (c.kind === 2 && c.mood === 'wander') {
    if (!c.wander) c.wander = randomSpot(null, 0, [], 0) || { x: mouse.x, y: mouse.y };
    return c.wander;
  }
  if (c.kind === 1) {
    const sp = Math.hypot(mouse.vx, mouse.vy);
    if (sp > 10 && Math.hypot(c.x - mouse.x, c.y - mouse.y) > 30) {
      return { x: clamp(mouse.x + mouse.vx / sp * 34, MIN_X + 6, MAX_X - 6), y: clamp(mouse.y + mouse.vy / sp * 34, MIN_Y + 8, MAX_Y - 2) };
    }
  }
  return { x: mouse.x, y: mouse.y };
}

const HARMLESS = ['away', 'idle', 'stuck', 'slip', 'dizzy'];

function updateCat(c, dt, now) {
  c.anim += dt * 7;
  if (c.state === 'idle') return;
  if (c.state === 'away') {
    c.timer -= dt;
    if (c.timer <= 0) {
      c.state = 'chase';
      const d = doorSpot(); c.x = d.x; c.y = d.y;
      burst(c.x, c.y - 4, ['#8a5a36', '#f596b4', '#ffffff'], 8);
      sfx.meow();
    }
    return;
  }
  let speed = 0, dir = null;
  if (c.kind === 2) {
    c.moodT -= dt;
    if (c.moodT <= 0) { c.mood = c.mood === 'hunt' ? 'wander' : 'hunt'; c.moodT = c.mood === 'hunt' ? 5 : 2.5; c.wander = null; }
  }
  switch (c.state) {
    case 'chase': {
      const t = catTarget(c);
      if (c.wander && Math.hypot(c.x - c.wander.x, c.y - c.wander.y) < 10) c.wander = null;
      dir = steer(c.x, c.y, t.x, t.y, now);
      speed = G.speed * (c.kind === 1 ? 1.08 : c.kind === 4 ? 0.9 : 1) * (t.yarn ? 1.15 : 1);
      c.cool -= dt;
      const dm = Math.hypot(mouse.x - c.x, mouse.y - c.y);
      const range = c.kind === 2 ? 44 : 34;
      if (!t.yarn && G.pounce && c.cool <= 0 && dm < range && dm > 12 && mouse.invuln <= 0 && clearPath(c.x, c.y, mouse.x, mouse.y, 5, 3)) {
        c.state = 'crouch'; c.timer = 0.6; c.vx = c.vy = 0;
        sfx.hiss();
      }
      // Nudge free when wedged against a corner.
      c.jam = Math.hypot(c.x - c.lastX, c.y - c.lastY) < speed * dt * 0.2 ? c.jam + dt : 0;
      c.lastX = c.x; c.lastY = c.y;
      if (c.jam > 0.4) { c.jx = rand(-1, 1); c.jy = rand(-1, 1); c.jam = 0; c.jt = 0.35; }
      if (c.jt > 0) { c.jt -= dt; dir = { x: c.jx, y: c.jy }; }
      break;
    }
    case 'crouch':
      c.timer -= dt;
      c.face = faceFrom(mouse.x - c.x, mouse.y - c.y, c.face);
      if (c.timer <= 0) {
        const dx = mouse.x - c.x, dy = mouse.y - c.y, d = Math.hypot(dx, dy) || 1;
        c.state = 'pounce'; c.timer = 0.3; c.dx = dx / d; c.dy = dy / d;
        sfx.pounce();
      }
      break;
    case 'pounce':
      c.timer -= dt;
      dir = { x: c.dx, y: c.dy }; speed = 135;
      if (c.timer <= 0) { c.state = 'recover'; c.timer = 0.7; }
      break;
    case 'recover':
      c.timer -= dt;
      if (c.timer <= 0) { c.state = 'chase'; c.cool = 2.5 + Math.random() * 1.2; }
      break;
    case 'stuck':
    case 'dizzy':
      c.timer -= dt;
      if (c.timer <= 0) { c.state = 'chase'; c.cool = 1; }
      break;
    case 'slip':
      c.timer -= dt;
      dir = { x: c.dx, y: c.dy }; speed = 115;
      c.face = ['down', 'left', 'up', 'right'][Math.floor(c.timer * 14) % 4];
      if (c.timer <= 0) { c.state = 'dizzy'; c.timer = 1.8; }
      break;
  }
  if (dir && speed) {
    // Keep cats from stacking on top of each other.
    let sx = 0, sy = 0;
    for (const o of cats) {
      if (o === c || o.state === 'away') continue;
      const ddx = c.x - o.x, ddy = c.y - o.y, dd = Math.hypot(ddx, ddy);
      if (dd > 0 && dd < 14) { sx += ddx / dd * (14 - dd) / 14; sy += ddy / dd * (14 - dd) / 14; }
    }
    const wx = dir.x + sx * 0.9, wy = dir.y + sy * 0.9, wl = Math.hypot(wx, wy) || 1;
    const k = Math.min(1, dt * (c.state === 'pounce' || c.state === 'slip' ? 30 : 9));
    c.vx += (wx / wl * speed - c.vx) * k; c.vy += (wy / wl * speed - c.vy) * k;
  } else {
    const k = Math.min(1, dt * 12);
    c.vx -= c.vx * k; c.vy -= c.vy * k;
  }
  c.hitX = c.hitY = false;
  moveBox(c, c.vx * dt, c.vy * dt);
  if (c.state === 'pounce' && (c.hitX || c.hitY)) { c.state = 'recover'; c.timer = 0.6; }
  if (c.state === 'slip' && (c.hitX || c.hitY)) { c.state = 'dizzy'; c.timer = 1.8; sfx.bonk(); }
  if (c.state !== 'crouch' && c.state !== 'slip') c.face = faceFrom(c.vx, c.vy, c.face);
  // Traps
  for (let i = traps.length - 1; i >= 0; i--) {
    const t = traps[i];
    if (HARMLESS.includes(c.state) || Math.hypot(t.x - c.x, t.y - c.y) > 8) continue;
    traps.splice(i, 1);
    if (t.type === 'honey') {
      c.state = 'stuck'; c.timer = 3.6; c.vx = c.vy = 0; c.x = t.x; c.y = t.y;
      toast(`${CATS[c.kind].name} נתקע בדבש!`, 'good');
      sfx.stuck();
    } else {
      const sp = Math.hypot(c.vx, c.vy);
      c.state = 'slip'; c.timer = 0.55;
      c.dx = sp ? c.vx / sp : 1; c.dy = sp ? c.vy / sp : 0;
      toast(`${CATS[c.kind].name} החליק על הבננה!`, 'good');
      sfx.slip();
    }
    if (G.mode === 'endless') addScore(15, c.x, c.y - 18);
  }
}

function updateItems(dt) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.phase += dt;
    if (it.life !== undefined) { it.life -= dt; if (it.life <= 0) { items.splice(i, 1); continue; } }
    if (Math.hypot(mouse.x - it.x, mouse.y - it.y) > 10) continue;
    items.splice(i, 1);
    collect(it);
  }
  for (let i = traps.length - 1; i >= 0; i--) { traps[i].life -= dt; if (traps[i].life <= 0) traps.splice(i, 1); }
  if (yarnBall) {
    const y = yarnBall;
    y.life -= dt;
    y.hitX = y.hitY = false;
    moveBox(y, y.vx * dt, y.vy * dt);
    if (y.hitX) y.vx = -y.vx;
    if (y.hitY) y.vy = -y.vy;
    y.spin += dt * Math.hypot(y.vx, y.vy) / 4;
    if (Math.random() < dt * 1.2) { const a = Math.random() * Math.PI * 2; y.vx = Math.cos(a) * 55; y.vy = Math.sin(a) * 55; }
    if (y.life <= 0) { yarnBall = null; burst(y.x, y.y - 4, ['#ff78b4', '#c7477f'], 8); }
  }
}

function collect(it) {
  const X = it.x, Y = it.y - 12;
  switch (it.type) {
    case 'cheese':
    case 'gold': {
      const gold = it.type === 'gold', pts = gold ? 50 : 10;
      burst(it.x, it.y - 5, gold ? ['#ffd23f', '#ffffff', '#ffe36b'] : ['#ffe36b', '#f7b52c', '#fff6c0'], gold ? 16 : 10);
      gold ? sfx.gold() : sfx.cheese();
      addScore(pts, X, Y);
      if (G.mode === 'endless') {
        G.eaten++;
        if (!it.power) spawnCheese();
        if (G.eaten >= G.nextCatAt) {
          G.nextCatAt += 4;
          G.speed = Math.min(56, G.speed + 2.5);
          if (cats.length < 5) { cats.push(makeCat(cats.length, 0.8)); toast(`${CATS[cats.length - 1].name} הצטרף לציד!`); }
          else toast('החתולים מהירים יותר!');
        }
      } else if (!it.power) {
        G.got++;
        if (G.got >= G.goal) openHole();
      }
      break;
    }
    case 'chili':
      mouse.boost = 5;
      burst(it.x, it.y - 5, ['#ff5a2a', '#ffb13b', '#e2362b'], 14);
      sfx.chili();
      toast('פלפל חריף! ריצה מהירה', 'hot');
      break;
    case 'yarn': {
      const a = Math.random() * Math.PI * 2;
      yarnBall = { x: mouse.x, y: mouse.y, vx: Math.cos(a) * 55, vy: Math.sin(a) * 55, hw: 3, hh: 2, life: 6.5, spin: 0 };
      for (const c of cats) if (c.state === 'crouch' || c.state === 'pounce') { c.state = 'chase'; c.cool = 2; }
      burst(it.x, it.y - 5, ['#ff78b4', '#c7477f', '#ffd0e4'], 14);
      sfx.yarn();
      toast('החתולים רודפים אחרי הצמר!', 'cold');
      break;
    }
    case 'heart':
      G.lives = Math.min(3, G.lives + 1);
      burst(it.x, it.y - 5, ['#ff4f64', '#ffc2cb'], 12);
      sfx.life();
      toast('עוד חיים!', 'good');
      break;
    case 'honey':
    case 'banana':
      if (inventory.length >= 3) inventory.shift();
      inventory.push(it.type);
      burst(it.x, it.y - 5, it.type === 'honey' ? ['#f0a020', '#ffd878'] : ['#ffd23f', '#fff2a0'], 10);
      sfx.pickup();
      if (!store.get('cheese-run2-traptip', false)) { store.set('cheese-run2-traptip', true); toast('לחצו על הכפתור למטה כדי להניח מלכודת', 'good'); }
      else toast(it.type === 'honey' ? 'מלכודת דבש' : 'קליפת בננה', 'good');
      updateTrapButton();
      break;
  }
  updateHud();
}

function openHole() {
  G.holeOpen = true;
  sfx.open();
  toast('כל הגבינות אצלכם! רוצו לחור', 'good');
  burst(room.hole, WALL_TOP - 8, ['#ffd23f', '#ffffff'], 16);
}

function placeTrap() {
  if (G.screen !== 'play' || !inventory.length) return;
  const type = inventory.shift();
  traps.push({ type, x: mouse.x, y: mouse.y, life: 22 });
  sfx.place();
  burst(mouse.x, mouse.y - 2, type === 'honey' ? ['#f0a020', '#ffd878'] : ['#ffd23f'], 6);
  updateTrapButton();
}

function addScore(pts, x, y) {
  if (!pts) return;
  G.score += pts;
  floaters.push({ x, y, text: '+' + pts, color: pts >= 50 ? '#fffbd0' : '#ffe36b', t: 0 });
  updateHud();
}

function checkCatch() {
  if (mouse.invuln > 0 || yarnBall) return;
  for (const c of cats) {
    if (HARMLESS.includes(c.state)) continue;
    if (Math.abs(c.x - mouse.x) < 8 && Math.abs(c.y - mouse.y) < 6) { caught(c); return; }
  }
}

function caught(cat) {
  G.screen = 'caught';
  G.stateTime = 0;
  cat.happy = true;
  G.shake = reduceMotion ? 0 : 0.35;
  G.flash = 0.25;
  burst(mouse.x, mouse.y - 6, ['#ffffff', '#aaa6be', '#f596b4'], 16);
  sfx.caught();
  releaseJoystick();
  try { if (navigator.vibrate) navigator.vibrate([60, 40, 160]); } catch (e) { /* not allowed here */ }
}

function afterCaught() {
  G.lives--; G.livesLost++;
  updateHud();
  if (G.lives <= 0) {
    if (G.mode === 'story') {
      G.screen = 'lose';
      $('loseText').textContent = G.got ? `אספתם ${G.got} מתוך ${G.goal} גבינות. עוד ניסיון?` : 'טיפ: כשחתול מתכופף ומופיע "!", זוזו הצידה.';
      showScreen('loseScreen');
    } else {
      G.screen = 'over';
      const record = G.score > best;
      if (record) { best = G.score; store.set('cheese-run2-best', best); }
      $('overScore').textContent = G.score; $('overCheese').textContent = G.eaten; $('overBest').textContent = best;
      $('overText').textContent = record && G.score > 0 ? 'שיא חדש!' : `השיא שלכם: ${best}`;
      $('bestMenu').textContent = best;
      showScreen('overScreen');
    }
    sfx.over();
    return;
  }
  // Start again from the hole; if it is already open, land somewhere away from it instead.
  let spot = holeSpot();
  if (G.holeOpen) spot = randomSpot(null, 0, cats, 50, { x: room.hole, y: WALL_TOP, d: 120 }) || spot;
  Object.assign(mouse, { x: spot.x, y: spot.y, vx: 0, vy: 0, invuln: 2.2, face: 'down' });
  cats.forEach((c, i) => Object.assign(c, makeCat(c.kind, 2 + i * 1.5)));
  yarnBall = null;
  G.screen = 'play';
  toast(G.lives === 1 ? 'נשארו חיים אחרונים!' : `נשארו ${G.lives} חיים`);
}

function reachHome() {
  G.screen = 'home';
  G.stateTime = 0;
  releaseJoystick();
  $('trapBtn').hidden = true;
  sfx.win();
  burst(room.hole, WALL_TOP - 6, ['#ffd23f', '#ffffff', '#9be15d'], 20);
}

function showWin() {
  G.screen = 'win';
  const L = LEVELS[G.level];
  const par = L.cheese * 5 + 12;
  const stars = 1 + (G.livesLost === 0 ? 1 : 0) + (G.clock <= par ? 1 : 0);
  progress.stars[G.level] = Math.max(progress.stars[G.level] || 0, stars);
  progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, G.level + 2));
  store.set('cheese-run2-progress', progress);
  const wrap = $('winStars');
  wrap.replaceChildren();
  for (let i = 0; i < 3; i++) {
    const img = new Image(); img.alt = '';
    img.src = i < stars ? ICONS.star : ICONS.starOff;
    if (i < stars) { img.className = 'pop'; img.style.animationDelay = `${i * 180}ms`; }
    wrap.appendChild(img);
  }
  wrap.setAttribute('aria-label', `${stars} כוכבים`);
  $('winTime').textContent = `${Math.round(G.clock)}s`;
  $('winLives').textContent = G.lives;
  const tips = [];
  if (G.livesLost) tips.push('בלי להיתפס');
  if (G.clock > par) tips.push(`בפחות מ־${par} שניות`);
  $('winTip').textContent = stars === 3 ? 'שלושה כוכבים!' : `לשלושה כוכבים: סיימו ${tips.join(' ו')}.`;
  $('nextBtn').textContent = G.level >= LEVELS.length - 1 ? 'למשחק האינסופי' : 'לשלב הבא';
  showScreen('winScreen');
}

function update(dt) {
  G.time += dt;
  if (G.shake > 0) G.shake -= dt;
  if (G.flash > 0) G.flash -= dt;
  updateEffects(dt);
  G.stateTime += dt;
  switch (G.screen) {
    case 'play': {
      G.clock += dt;
      updateMouse(dt);
      for (const c of cats) updateCat(c, dt, G.time);
      updateItems(dt);
      if (G.screen !== 'play') return;
      if (G.holeOpen && Math.abs(mouse.x - room.hole) < 9 && mouse.y < WALL_TOP + 10) { reachHome(); return; }
      checkCatch();
      G.itemTimer -= dt;
      if (G.itemTimer <= 0) {
        if (!items.some((i) => i.power)) spawnPowerup();
        G.itemTimer = rand(8, 12);
      }
      break;
    }
    case 'caught':
      if (G.stateTime > 1.3) afterCaught();
      break;
    case 'home':
      if (G.stateTime > 1.1) showWin();
      break;
    default:
      for (const c of cats) c.anim += dt * 3;
  }
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += dt; if (floaters[i].t > 1) floaters.splice(i, 1); }
}
function burst(x, y, colors, n) {
  if (reduceMotion) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(30, 90);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(0.3, 0.7), max: 0.7, color: pick(colors) });
  }
}

// ============================================================
// Render
// ============================================================
let scale = 3, vw = 130, vh = 280, camX = 0, camY = 0, hudPx = 22;

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(6,4,14,0.45)';
  ctx.fillRect(Math.round(x - w / 2), Math.round(y - 1), w, 2);
  ctx.fillRect(Math.round(x - w / 2) + 1, Math.round(y - 2), w - 2, 1);
}
function frameFor(set, face, moving, anim) {
  const f = set[face];
  if (face === 'left' || face === 'right') return f[moving ? Math.floor(anim) % 2 : 0];
  return f[moving ? 1 + (Math.floor(anim) % 2) : 0];
}

function render() {
  const t = G.time;
  // Camera follows the mouse; above the wall it may scroll under the HUD strip.
  if (mouse) {
    const tx = WW <= vw ? (WW - vw) / 2 : clamp(mouse.x - vw / 2, 0, WW - vw);
    const ty = WH + hudPx <= vh ? (WH - vh - hudPx) / 2 : clamp(mouse.y - (vh + hudPx) / 2, -hudPx, WH - vh);
    const k = G.screen === 'play' ? 0.14 : 1;
    camX += (tx - camX) * k; camY += (ty - camY) * k;
  }
  let sx = Math.round(camX), sy = Math.round(camY);
  if (G.shake > 0) { sx += Math.round(rand(-2, 2)); sy += Math.round(rand(-2, 2)); }

  ctx.fillStyle = '#0b0816';
  ctx.fillRect(0, 0, vw, vh);
  ctx.save();
  ctx.translate(-sx, -sy);
  ctx.drawImage(roomCanvas, 0, 0);

  if (G.holeOpen) {
    const hx = room.hole, on = Math.floor(t * 4) % 2;
    ctx.fillStyle = on ? '#ffd23f' : '#f09a1f';
    ctx.fillRect(hx - 8, WALL_TOP - 13, 1, 13); ctx.fillRect(hx + 7, WALL_TOP - 13, 1, 13);
    ctx.fillRect(hx - 6, WALL_TOP - 16, 12, 1);
    const bob = Math.round(Math.sin(t * 6) * 2), ay = WALL_TOP - 27 + bob;
    ctx.fillStyle = OUT; ctx.fillRect(hx - 4, ay - 1, 9, 7); ctx.fillRect(hx - 2, ay + 6, 5, 2); ctx.fillRect(hx - 1, ay + 8, 3, 1);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(hx - 3, ay, 7, 5); ctx.fillRect(hx - 1, ay + 5, 3, 2); ctx.fillRect(hx, ay + 7, 1, 1);
  }

  for (const tr of traps) {
    if (tr.life < 3 && Math.floor(tr.life * 8) % 2) continue;
    if (tr.type === 'honey') ctx.drawImage(SPR.puddle, Math.round(tr.x - 8), Math.round(tr.y - 5));
    else ctx.drawImage(SPR.items.banana, Math.round(tr.x - 8), Math.round(tr.y - 11));
  }
  for (const c of cats) if (c.state === 'stuck') ctx.drawImage(SPR.puddle, Math.round(c.x - 8), Math.round(c.y - 5));

  // Depth-sorted scene: whatever stands lower on screen is drawn in front.
  const scene = [];
  for (const f of furn) scene.push({ base: f.base, draw: () => ctx.drawImage(f.img, f.f.x, f.f.y - f.f.H) });
  for (const it of items) scene.push({ base: it.y, draw: () => drawItem(it) });
  if (yarnBall) scene.push({ base: yarnBall.y, draw: () => drawYarn(yarnBall) });
  for (const c of cats) if (c.state !== 'away') scene.push({ base: c.y, draw: () => drawCat(c) });
  if (mouse && (G.screen !== 'home' || G.stateTime < 0.25)) scene.push({ base: mouse.y, draw: () => drawMouse(mouse) });
  scene.sort((a, b) => a.base - b.base);
  for (const s of scene) s.draw();
  // Show characters that are hidden behind furniture as see-through silhouettes.
  ctx.globalAlpha = 0.5;
  for (const e of [mouse, ...cats]) {
    const d = e && e.drawn;
    if (!d || e.drawnAt !== t) continue;
    const hidden = furn.some((f) => f.base > e.y && d.x < f.f.x + f.f.w && d.x + 16 > f.f.x && d.y < f.base && d.y + 16 > f.f.y - f.f.H);
    if (hidden) ctx.drawImage(d.img, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  for (const c of cats) {
    if (c.state === 'crouch' && Math.floor(t * 10) % 2 === 0) drawText(ctx, '!', Math.round(c.x) - 1, Math.round(c.y) - 22, '#ff5d6c');
  }
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    if (p.life > p.max * 0.5) ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y), 1, 1);
  }
  for (const f of floaters) {
    const x = Math.round(f.x - textWidth(f.text) / 2), y = Math.round(f.y - f.t * 16);
    if (f.t < 0.75 || Math.floor(f.t * 20) % 2) drawText(ctx, f.text, x, y, f.color);
  }
  if (mouse && mouse.boost > 0 && G.screen === 'play') {
    const w = Math.ceil(12 * mouse.boost / 5);
    ctx.fillStyle = OUT; ctx.fillRect(Math.round(mouse.x) - 7, Math.round(mouse.y) + 2, 14, 3);
    ctx.fillStyle = '#ff8a3a'; ctx.fillRect(Math.round(mouse.x) - 6, Math.round(mouse.y) + 3, w, 1);
  }
  ctx.restore();

  if (G.screen === 'play' || G.screen === 'caught') drawIndicators(sx, sy);
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,93,108,${G.flash})`; ctx.fillRect(0, 0, vw, vh); }
}

function drawItem(it) {
  if (it.life !== undefined && it.life < 3 && Math.floor(it.life * 8) % 2) return;
  if (it.born !== undefined && G.time - it.born < 0.3 && Math.floor((G.time - it.born) * 20) % 2) return;
  const bob = Math.round(Math.sin(it.phase * 3.4) * 1.2);
  drawShadow(it.x, it.y, 10);
  ctx.drawImage(SPR.items[it.type], Math.round(it.x - 8), Math.round(it.y - 15 + bob));
  if (it.power || it.type === 'gold') {
    const s = Math.floor(it.phase * 6) % 4, ox = [-6, 6, 5, -5][s], oy = [-14, -16, -4, -6][s];
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(it.x + ox), Math.round(it.y + oy - 1), 1, 3); ctx.fillRect(Math.round(it.x + ox - 1), Math.round(it.y + oy), 3, 1);
  }
}
function drawYarn(y) {
  drawShadow(y.x, y.y, 8);
  ctx.drawImage(SPR.items.yarn, Math.round(y.x - 8), Math.round(y.y - 13 - Math.abs(Math.sin(y.spin)) * 2));
}
function drawMouse(m) {
  if (m.invuln > 0 && Math.floor(m.invuln * 12) % 2) return;
  const moving = Math.hypot(m.vx, m.vy) > 6 && G.screen === 'play';
  let img, dy = 0;
  if (G.screen === 'caught') {
    img = SPR.mouse.hit[m.face === 'left' ? 'left' : 'right'];
    dy = -Math.round(Math.sin(Math.min(G.stateTime, 0.5) / 0.5 * Math.PI) * 6);
  } else img = frameFor(SPR.mouse, m.face, moving, m.anim);
  drawShadow(m.x, m.y, 10);
  m.drawn = { img, x: Math.round(m.x - 8), y: Math.round(m.y - 15 + dy) }; m.drawnAt = G.time;
  ctx.drawImage(img, m.drawn.x, m.drawn.y);
  if (G.screen === 'caught') {
    for (let i = 0; i < 3; i++) {
      const a = G.time * 7 + i * 2.1;
      ctx.fillStyle = i === 1 ? '#ffffff' : '#ffe36b';
      ctx.fillRect(Math.round(m.x + Math.cos(a) * 7), Math.round(m.y - 16 + Math.sin(a) * 2 + dy), 1, 1);
    }
  }
}
function drawCat(c) {
  const set = SPR.cats[c.kind % SPR.cats.length];
  let img, ox = 0, oy = 0;
  if (c.state === 'crouch') {
    const side = c.face === 'left' || c.face === 'right' ? c.face : (mouse.x < c.x ? 'left' : 'right');
    img = set.crouch[side];
    ox = Math.floor(G.time * 30) % 2;
  } else if (c.state === 'stuck') {
    img = frameFor(set, c.face, true, G.time * 10);
    ox = Math.floor(G.time * 20) % 2 ? 1 : -1;
  } else {
    const moving = Math.hypot(c.vx, c.vy) > 6 && G.screen === 'play';
    img = frameFor(set, c.face, moving, c.anim);
    if (!moving) oy = Math.floor(c.anim) % 4 === 0 ? -1 : 0;
    if (c.state === 'pounce') oy = -3;
    if (G.screen === 'caught' && c.happy) oy = -Math.round(Math.abs(Math.sin(G.time * 9)) * 2);
  }
  drawShadow(c.x, c.y, 12);
  c.drawn = { img, x: Math.round(c.x - 8 + ox), y: Math.round(c.y - 15 + oy) }; c.drawnAt = G.time;
  ctx.drawImage(img, c.drawn.x, c.drawn.y);
  if (c.state === 'dizzy' || c.state === 'stuck') {
    for (let i = 0; i < 2; i++) {
      const a = G.time * 6 + i * Math.PI;
      const x = Math.round(c.x + Math.cos(a) * 7), y = Math.round(c.y - 17 + Math.sin(a) * 2);
      ctx.fillStyle = c.state === 'stuck' ? '#ffd878' : '#ffe36b';
      ctx.fillRect(x, y - 1, 1, 3); ctx.fillRect(x - 1, y, 3, 1);
    }
  }
  if (yarnBall && c.state === 'chase' && Math.floor(G.time * 3) % 2) {
    ctx.fillStyle = '#ff78b4';
    ctx.fillRect(Math.round(c.x) - 1, Math.round(c.y) - 20, 3, 2); ctx.fillRect(Math.round(c.x), Math.round(c.y) - 18, 1, 1);
  }
}

// Edge markers for cats, the nearest cheese and the open hole when they are off screen.
function drawIndicators(sx, sy) {
  const top = Math.ceil(hudPx) + 3, pad = 4;
  const mark = (wx, wy, color, big) => {
    const x = wx - sx, y = wy - sy;
    if (x > 0 && x < vw && y > top && y < vh) return;
    const cx = vw / 2, cy = (vh + top) / 2, dx = x - cx, dy = y - cy;
    const tx = dx ? ((dx > 0 ? vw - pad : pad) - cx) / dx : Infinity;
    const ty = dy ? ((dy > 0 ? vh - pad : top + pad) - cy) / dy : Infinity;
    const k = Math.min(tx, ty);
    const px = Math.round(cx + dx * k), py = Math.round(cy + dy * k), r = big ? 3 : 2;
    ctx.fillStyle = OUT; ctx.fillRect(px - r - 1, py - r - 1, 2 * r + 3, 2 * r + 3);
    ctx.fillStyle = color; ctx.fillRect(px - r, py - r, 2 * r + 1, 2 * r + 1);
    const len = Math.hypot(dx, dy) || 1, ax = Math.round(px + dx / len * (r + 3)), ay = Math.round(py + dy / len * (r + 3));
    ctx.fillStyle = OUT; ctx.fillRect(ax - 1, ay - 1, 3, 3); ctx.fillStyle = color; ctx.fillRect(ax, ay, 1, 1);
  };
  for (const c of cats) if (!['away', 'idle'].includes(c.state)) mark(c.x, c.y - 6, CATS[c.kind].pal.o, false);
  if (G.holeOpen) {
    if (Math.floor(G.time * 4) % 2) mark(room.hole, WALL_TOP - 6, '#ffd23f', true);
  } else {
    let near = null, nd = Infinity;
    for (const it of items) {
      if (it.type !== 'cheese' && it.type !== 'gold') continue;
      const d = Math.hypot(it.x - mouse.x, it.y - mouse.y);
      if (d < nd) { nd = d; near = it; }
    }
    if (near) mark(near.x, near.y - 6, '#ffe36b', false);
  }
}

// ============================================================
// Screens, HUD, toast
// ============================================================
function iconURL(img, w, h, ox, oy) {
  const [c, g] = newCanvas(w || img.width, h || img.height);
  g.drawImage(img, ox || 0, oy || 0);
  return c.toDataURL();
}
const ICONS = {
  cheese: iconURL(SPR.items.cheese, 16, 14, 0, -2),
  heart: iconURL(SPR.heartIcon),
  star: iconURL(SPR.star),
  starOff: iconURL(SPR.starOff),
  honey: iconURL(SPR.items.honey, 16, 14, 0, -1),
  banana: iconURL(SPR.items.banana, 16, 14, 0, -1),
};
document.querySelectorAll('img[data-icon]').forEach((img) => { img.src = ICONS[img.dataset.icon]; });

function drawHero() {
  const [c, g] = newCanvas(80, 34);
  for (let x = 0; x < 80; x += 8) for (let y = 18; y < 34; y += 8) { g.fillStyle = ((x + y) / 8) % 2 ? '#2d3b66' : '#26315a'; g.fillRect(x, y, 8, 8); }
  g.fillStyle = 'rgba(6,4,14,0.45)';
  g.fillRect(4, 29, 12, 2); g.fillRect(18, 28, 12, 2); g.fillRect(46, 29, 10, 2); g.fillRect(62, 29, 11, 2);
  g.drawImage(SPR.cats[0].right[1], 2, 14);
  g.drawImage(SPR.cats[1].crouch.right, 17, 13);
  g.drawImage(SPR.mouse.right[1], 42, 14);
  g.drawImage(SPR.items.cheese, 59, 15);
  g.fillStyle = OUT; g.fillRect(24, 3, 3, 6); g.fillRect(24, 10, 3, 3);
  g.fillStyle = '#ff5d6c'; g.fillRect(25, 4, 1, 4); g.fillRect(25, 11, 1, 1);
  $('hero').src = c.toDataURL();
}
drawHero();

const hudCache = {};
function updateHud(force) {
  const set = (id, v) => { if (force || hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } };
  if (G.mode === 'endless') set('cheeseText', String(G.score));
  else set('cheeseText', `${G.got}/${G.goal}`);
  $('cheeseChip').classList.toggle('done', G.mode === 'story' && G.holeOpen);
  if (force || hudCache.lives !== G.lives) {
    hudCache.lives = G.lives;
    const el = $('hearts');
    el.replaceChildren();
    el.setAttribute('aria-label', `${G.lives} חיים`);
    for (let i = 0; i < G.lives; i++) { const img = new Image(); img.src = ICONS.heart; img.alt = ''; el.appendChild(img); }
  }
}
function updateTrapButton() {
  $('trapBtn').hidden = !inventory.length || G.screen !== 'play';
  if (!inventory.length) return;
  $('trapIcon').src = ICONS[inventory[0]];
  $('trapCount').textContent = inventory.length;
  $('trapCap').textContent = inventory[0] === 'honey' ? 'דבש' : 'בננה';
}

let toastTimer = 0;
function toast(msg, kind) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (kind ? ' ' + kind : ''); }, 1900);
}

const SCREENS = ['menuScreen', 'levelsScreen', 'pauseScreen', 'winScreen', 'loseScreen', 'overScreen'];
function showScreen(id) {
  $('overlay').hidden = !id;
  for (const s of SCREENS) $(s).hidden = s !== id;
  $('hud').hidden = !(id === null || id === 'pauseScreen');
  $('trapBtn').hidden = !(G.screen === 'play' && inventory.length);
  if (id) { $('hint').hidden = true; $('joy').hidden = true; }
}

function openMenu() {
  G.screen = 'menu';
  $('bestMenu').textContent = best;
  showScreen('menuScreen');
}
function openLevels() {
  G.screen = 'levels';
  const grid = $('levelGrid');
  grid.replaceChildren();
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    const locked = i >= progress.unlocked;
    const stars = progress.stars[i] || 0;
    b.className = 'lvl' + (locked ? ' locked' : '') + (!locked && !stars ? ' next' : '');
    b.disabled = locked;
    b.setAttribute('aria-label', locked ? `שלב ${i + 1}, נעול` : `שלב ${i + 1}, ${ROOMS[L.room].name}, ${stars} כוכבים`);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    const s = document.createElement('span'); s.className = 'stars';
    for (let k = 0; k < 3; k++) { const img = new Image(); img.alt = ''; img.src = k < stars ? ICONS.star : ICONS.starOff; s.appendChild(img); }
    b.append(n, s);
    b.addEventListener('click', () => { audio(); startStory(i); });
    grid.appendChild(b);
  });
  showScreen('levelsScreen');
}
function pause() {
  if (!['play', 'caught', 'home'].includes(G.screen)) return;
  G.prev = G.screen;
  G.screen = 'paused';
  releaseJoystick();
  showScreen('pauseScreen');
}
function resume() {
  if (G.screen !== 'paused') return;
  G.screen = G.prev || 'play';
  showScreen(null);
}

// Android back button: step back one screen; returns false when the app should close.
window.cheeseRunBack = () => {
  switch (G.screen) {
    case 'play': case 'caught': case 'home': pause(); return true;
    case 'paused': resume(); return true;
    case 'levels': case 'over': openMenu(); return true;
    case 'win': case 'lose': openLevels(); return true;
    default: return false;
  }
};

// ============================================================
// Sound
// ============================================================
let actx = null;
let muted = !!store.get('cheese-run2-muted', false);
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, opts = {}) {
  if (muted || !actx) return;
  const { type = 'square', vol = 0.06, to = null, delay = 0, vib = 0 } = opts;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  if (vib) {
    const l = actx.createOscillator(), lg = actx.createGain();
    l.frequency.value = 18; lg.gain.value = vib;
    l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0 + dur);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, from, to) {
  if (muted || !actx) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(from, actx.currentTime);
  f.frequency.exponentialRampToValueAtTime(to, actx.currentTime + dur);
  g.gain.value = vol;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
const sfx = {
  cheese() { tone(988, 0.06); tone(1480, 0.08, { delay: 0.055 }); },
  gold() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.09, { delay: i * 0.06, vol: 0.05 })); },
  chili() { tone(300, 0.35, { to: 1400, type: 'sawtooth', vol: 0.04 }); },
  yarn() { tone(520, 0.4, { to: 260, type: 'triangle', vol: 0.09, vib: 40 }); },
  pickup() { tone(660, 0.06, { type: 'triangle', vol: 0.1 }); tone(990, 0.08, { type: 'triangle', vol: 0.1, delay: 0.06 }); },
  place() { tone(220, 0.1, { to: 140, type: 'triangle', vol: 0.12 }); },
  stuck() { tone(160, 0.35, { to: 90, type: 'sawtooth', vol: 0.05, vib: 12 }); },
  slip() { tone(900, 0.25, { to: 200, type: 'triangle', vol: 0.1 }); },
  bonk() { tone(120, 0.12, { vol: 0.08 }); },
  hiss() { noise(0.35, 0.18, 3000, 6000); },
  pounce() { noise(0.12, 0.2, 1500, 400); },
  meow() { tone(640, 0.14, { to: 900, type: 'sawtooth', vol: 0.03, vib: 20 }); tone(900, 0.22, { to: 500, type: 'sawtooth', vol: 0.03, vib: 20, delay: 0.13 }); },
  caught() {
    tone(620, 0.18, { to: 880, type: 'sawtooth', vol: 0.05, vib: 25 });
    tone(880, 0.35, { to: 420, type: 'sawtooth', vol: 0.05, vib: 25, delay: 0.17 });
    tone(90, 0.25, { type: 'triangle', vol: 0.15, delay: 0.05 });
  },
  open() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, { delay: i * 0.08, vol: 0.05 })); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.12, { delay: i * 0.09, vol: 0.05 })); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, { delay: i * 0.18, type: 'triangle', vol: 0.1 })); },
  life() { [659, 880, 1319].forEach((f, i) => tone(f, 0.1, { delay: i * 0.08, vol: 0.05 })); },
  click() { tone(880, 0.04, { type: 'triangle', vol: 0.06 }); },
};
function setMuted(v) {
  muted = v;
  store.set('cheese-run2-muted', muted);
  const b = $('soundBtn');
  b.setAttribute('aria-pressed', String(muted));
  b.textContent = muted ? 'צליל: כבוי' : 'צליל: פועל';
}

// ============================================================
// Input: floating joystick (touch or mouse drag) and keyboard
// ============================================================
const joy = { id: null, ox: 0, oy: 0, R: 50 };
const app = $('app');
function releaseJoystick() {
  joy.id = null;
  input.x = input.y = 0;
  $('joy').hidden = true;
}
app.addEventListener('pointerdown', (e) => {
  if (G.screen !== 'play' || joy.id !== null) return;
  if (e.target.closest('button, .overlay')) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY;
  try { app.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
  const el = $('joy');
  el.style.left = `${joy.ox}px`; el.style.top = `${joy.oy}px`;
  $('knob').style.transform = '';
  el.hidden = false;
  e.preventDefault();
});
app.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy, d = Math.hypot(dx, dy);
  // The base follows the thumb once it slides past the rim.
  if (d > joy.R * 1.25) {
    const over = d - joy.R * 1.25;
    joy.ox += dx / d * over; joy.oy += dy / d * over;
    dx = e.clientX - joy.ox; dy = e.clientY - joy.oy; d = Math.hypot(dx, dy);
    const el = $('joy'); el.style.left = `${joy.ox}px`; el.style.top = `${joy.oy}px`;
  }
  const r = Math.min(d, joy.R);
  $('knob').style.transform = d ? `translate(${dx / d * r}px, ${dy / d * r}px)` : '';
  const k = d / joy.R, mag = k < 0.15 ? 0 : Math.min(1, (k - 0.15) / 0.6);
  input.x = d ? dx / d * mag : 0; input.y = d ? dy / d * mag : 0;
});
const endPointer = (e) => { if (e.pointerId === joy.id) releaseJoystick(); };
app.addEventListener('pointerup', endPointer);
app.addEventListener('pointercancel', endPointer);

const keys = new Set();
const MOVE_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'];
function keyInput() {
  if (joy.id !== null) return;
  const x = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  const y = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0);
  const l = Math.hypot(x, y) || 1;
  input.x = x / l; input.y = y / l;
}
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (MOVE_KEYS.includes(e.code)) { e.preventDefault(); keys.add(e.code); keyInput(); return; }
  if (e.code === 'Space' && G.screen === 'play') { e.preventDefault(); placeTrap(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); window.cheeseRunBack(); }
});
window.addEventListener('keyup', (e) => { keys.delete(e.code); keyInput(); });

$('trapBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); placeTrap(); });
$('pauseBtn').addEventListener('click', () => { audio(); pause(); });
$('playBtn').addEventListener('click', () => { audio(); sfx.click(); openLevels(); });
$('endlessBtn').addEventListener('click', () => { audio(); sfx.click(); startEndless(); });
$('soundBtn').addEventListener('click', () => { audio(); setMuted(!muted); sfx.click(); });
$('levelsBack').addEventListener('click', () => { sfx.click(); openMenu(); });
$('resumeBtn').addEventListener('click', () => { audio(); resume(); });
$('restartBtn').addEventListener('click', () => { audio(); G.mode === 'story' ? startStory(G.level) : startEndless(); });
$('quitBtn').addEventListener('click', () => { G.mode === 'story' ? openLevels() : openMenu(); });
$('nextBtn').addEventListener('click', () => { audio(); G.level >= LEVELS.length - 1 ? startEndless() : startStory(G.level + 1); });
$('winRetry').addEventListener('click', () => { audio(); startStory(G.level); });
$('winLevels').addEventListener('click', openLevels);
$('loseRetry').addEventListener('click', () => { audio(); startStory(G.level); });
$('loseLevels').addEventListener('click', openLevels);
$('overAgain').addEventListener('click', () => { audio(); startEndless(); });
$('overMenu').addEventListener('click', openMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ============================================================
// Layout and main loop
// ============================================================
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  // About 3.2 CSS px per game pixel keeps the characters thumb-sized on phones.
  const want = Math.max(3.2, Math.min(w / WW, h / (WH + 24)));
  const k = Math.max(1, Math.round(want * dpr));
  scale = k / dpr;
  vw = Math.ceil(w / scale); vh = Math.ceil(h / scale);
  canvas.width = vw; canvas.height = vh;
  canvas.style.width = `${vw * scale}px`;
  canvas.style.height = `${vh * scale}px`;
  ctx.imageSmoothingEnabled = false;
  if (!$('hud').hidden) hudPx = $('hud').offsetHeight / scale;
}
window.addEventListener('resize', resize);

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  if (G.screen !== 'paused') { while (acc >= STEP) { update(STEP); acc -= STEP; } }
  else acc = 0;
  render();
  requestAnimationFrame(frame);
}

function boot() {
  setMuted(muted);
  resize();
  hudPx = 70 / scale;
  // A calm scene behind the main menu.
  loadRoom(0);
  mouse = makeMouse();
  mouse.y = 100; mouse.x = 96;
  cats = [makeCat(0, 0), makeCat(1, 0)];
  cats.forEach((c, i) => { c.state = 'idle'; c.x = 50 + i * 90; c.y = 214; c.face = 'up'; });
  items = [];
  const rng = seeded(7);
  for (let i = 0; i < 4; i++) { const s = randomSpot(rng, 30, items, 30); if (s) items.push({ type: 'cheese', x: s.x, y: s.y, phase: i }); }
  openMenu();
  requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
}
boot();
})();
</script>
